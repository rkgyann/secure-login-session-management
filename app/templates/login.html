{% extends 'base.html' %}
{% block title %}Login · Secure Student Portal{% endblock %}
{% block content %}
<section class="form-card">
<p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1><p>Enter your password, then verify your authenticator code.</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ g.session.csrf_token }}">
  <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
  <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
  <button type="submit">Continue</button>
</form><p><a href="{{ url_for('reset.forgot_password') }}">Forgot your password?</a></p>
<p>New here? <a href="{{ url_for('portal.register') }}">Create an account</a>.</p>
</section>
{% endblock %}
