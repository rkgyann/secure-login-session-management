{% extends 'base.html' %}
{% block title %}Account security · Secure Student Portal{% endblock %}
{% block content %}
<section class="form-card"><p class="eyebrow">ACCOUNT SECURITY</p><h1>Change password</h1>
<p>Confirm your current password and a fresh authenticator code. Changing your password signs you out on every device.</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ g.session.csrf_token }}">
  <label for="current_password">Current password</label><input id="current_password" name="current_password" type="password" autocomplete="current-password" maxlength="128" required>
  <label for="new_password">New password</label><input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
  <label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
  <label for="code">Fresh authenticator code</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
  <button type="submit">Change password and sign out</button>
</form></section>
{% endblock %}
