services:
  - type: web
    name: portfolio-secure-login
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 wsgi:app
    envVars:
      - key: PORTAL_MASTER_SECRET
        generateValue: true
      - key: DATABASE_PASSWORD
        sync: false
